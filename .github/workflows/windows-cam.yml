name: Windows MSVC CAM regression
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cam: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pinned OpenCAMLib
        if: matrix.cam == 'ON'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./VisualStudio/FrezaEgm/tools/build_opencamlib.ps1
      - name: Configure MSVC x64
        shell: pwsh
        run: |
          $source = "$pwd/VisualStudio/FrezaEgm"
          $dependencyOptions = @()
          if ('${{ matrix.cam }}' -eq 'ON') {
            $dependencyOptions = @("-DCMAKE_PREFIX_PATH=$source/out/deps/ocl-Release", "-DBOOST_ROOT=$source/out/deps/boost_1_87_0")
          }
          cmake -S $source -B build -G "Visual Studio 17 2022" -A x64 -DFREZA_ENABLE_CAM=${{ matrix.cam }} @dependencyOptions
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows application and tests
        run: cmake --build build --config Release --parallel 4
      - name: Original selftest (including UDP loopback), regression, protected files
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Generate reference path offline
        if: matrix.cam == 'ON'
        run: ./build/tests/Release/FrezaEgm_cam_cli.exe VisualStudio/FrezaEgm/data/cam/Primer1.STL build/Primer1-base.csv mm 1 4 0.5 750 0 599.5
      - name: Analytic Bezier reference (independent of OpenCAMLib)
        run: ./build/tests/Release/FrezaEgm_bezier_cli.exe VisualStudio/FrezaEgm/data/bezier/plate.bpatch build/bezier-plate.csv 4 0.1 750 0 599.5 2
  analyzer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        id: cad-cache
        with:
          path: |
            build-bezier-viewer-deps/occt
            build-bezier-viewer-deps/eigen
          key: occt-7.9.3-eigen-3.4.0-msvc-x64-v1
      - name: Build pinned OCCT and Eigen
        run: cmake -P MillingAnalyzer/cmake/Dependencies.cmake
      - uses: actions/cache/save@v4
        if: steps.cad-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build-bezier-viewer-deps/occt
            build-bezier-viewer-deps/eigen
          key: occt-7.9.3-eigen-3.4.0-msvc-x64-v1
      - name: Configure independent geometry viewer
        run: cmake -S MillingAnalyzer -B build-bezier-viewer -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$pwd/build-bezier-viewer-deps/occt" -DEIGEN_INCLUDE_DIR="$pwd/build-bezier-viewer-deps/eigen"
      - name: Build geometry application
        run: cmake --build build-bezier-viewer --config Release --parallel 4
      - name: Geometry, quaternion, trim, collision and protected ABB tests
        run: ctest --test-dir build-bezier-viewer -C Release --output-on-failure
      - name: Create interactive Bezier preview
        run: ./build-bezier-viewer/Release/MillingAnalyzer.exe --demo --output build-bezier-viewer/demo
      - name: Create roughing and finishing program from reference STEP
        run: ./build-bezier-viewer/Release/MillingAnalyzer.exe MillingAnalyzer/data/stepped-solid.step --program --stock -2 -2 0 22 22 6 --confirm-centre-cutting --output build-bezier-viewer/program-demo
      - name: Create automatic whole-model machining program
        run: ./build-bezier-viewer/Release/MillingAnalyzer.exe MillingAnalyzer/data/automatic-box.step --auto-program --stock -2 -2 0 22 12 7 --confirm-centre-cutting --output build-bezier-viewer/automatic-demo
      - name: Build isolated virtual pose and force adapter
        run: |
          cmake -S experiments/robotstudio_pose_force -B build-virtual -G "Visual Studio 17 2022" -A x64 -DEIGEN_INCLUDE_DIR="$pwd/build-bezier-viewer-deps/eigen"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-virtual --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-virtual -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: MillingAnalyzer-Windows-x64
          path: |
            build-bezier-viewer/Release/*.exe
            build-bezier-viewer/Release/*.dll
            build-bezier-viewer/Release/licenses/
            build-bezier-viewer/demo/
            build-bezier-viewer/program-demo/
            build-bezier-viewer/automatic-demo/
            MillingAnalyzer/data/stepped-solid.step
            MillingAnalyzer/data/automatic-box.step
            docs/17-roughing-finishing-program.md
            build-virtual/Release/MillingVirtualEgm.exe
            experiments/robotstudio_pose_force/*.mod
            experiments/robotstudio_pose_force/README.md
